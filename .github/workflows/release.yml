name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run launcher tests
        shell: pwsh
        run: |
          .\tests\native-tray.tests.ps1
          .\tests\dsh-tray.tests.ps1

      - name: Enable MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build launcher
        shell: cmd
        run: |
          cd native
          rc /nologo /fo dsh-tray.res dsh-tray.rc
          cl /nologo /W4 /O2 /MT /utf-8 /DUNICODE /D_UNICODE /Fe:"..\DeepSeek Harness Launcher.exe" dsh-tray.c dsh-tray.res /link /SUBSYSTEM:WINDOWS ws2_32.lib shell32.lib advapi32.lib iphlpapi.lib user32.lib

      - name: Smoke test launcher startup
        shell: pwsh
        run: |
          $smokeDir = Join-Path $env:RUNNER_TEMP 'dsh-launcher-smoke'
          New-Item -ItemType Directory -Path $smokeDir -Force | Out-Null
          $node = (Get-Command node.exe -ErrorAction Stop).Source
          $fakeJs = Join-Path $smokeDir 'fake-dsh.js'
          @'
          const net = require('node:net')
          const server = net.createServer()
          server.listen(3080, '127.0.0.1')
          setInterval(() => {}, 1000)
          '@ | Set-Content -Path $fakeJs -Encoding ascii
          $fakeCmd = Join-Path $smokeDir 'dsh.cmd'
          "@`"$node`" `"$fakeJs`" %*" | Set-Content -Path $fakeCmd -Encoding ascii
          $env:PATH = "$smokeDir;$env:PATH"
          $launcher = Start-Process -FilePath '.\DeepSeek Harness Launcher.exe' -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $client = [Net.Sockets.TcpClient]::new('127.0.0.1', 3080)
                $client.Dispose()
                $ready = $true
                break
              } catch {}
            }
            if (-not $ready) { throw 'Launcher failed to start fake DSH on port 3080.' }
            $cmdChild = Get-CimInstance Win32_Process | Where-Object { $_.ParentProcessId -eq $launcher.Id -and $_.Name -eq 'cmd.exe' }
            if ($cmdChild) { throw 'Launcher startup must not create a cmd.exe child when dsh.cmd can be resolved directly.' }
          } finally {
            if (-not $launcher.HasExited) { Stop-Process -Id $launcher.Id -Force }
            Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like "*$fakeJs*" } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force }
          }

      - name: Validate and package launcher
        shell: pwsh
        run: |
          $exe = Get-Item 'DeepSeek Harness Launcher.exe'
          if ($exe.Length -lt 150KB) { throw "Unexpected launcher size: $($exe.Length) bytes" }
          if ($exe.VersionInfo.FileDescription -ne 'DeepSeek Harness Launcher') { throw 'Unexpected FileDescription' }
          if ($exe.VersionInfo.ProductName -ne 'DeepSeek Harness Launcher') { throw 'Unexpected ProductName' }
          if ($exe.VersionInfo.OriginalFilename -ne 'DeepSeek Harness Launcher.exe') { throw 'Unexpected OriginalFilename' }
          Compress-Archive -LiteralPath 'DeepSeek Harness Launcher.exe' -DestinationPath 'DeepSeek-Harness-Launcher.zip' -Force

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            "DeepSeek-Harness-Launcher.zip#DeepSeek Harness Launcher" `
            --title "DeepSeek Harness Launcher $env:GITHUB_REF_NAME" `
            --generate-notes
